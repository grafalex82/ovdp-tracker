schema: spec-driven

context: |
  «ОВДП Трекер» (ovdp-tracker) — небольшой пет-проект для единоличного учёта
  облигаций внутреннего государственного займа Украины. Python-пакет: ovdp_tracker.
  Пользователь добавляет облигации, отслеживает даты покупки и погашения,
  полученную и ожидаемую прибыль, смотрит статистику доходности
  за различные периоды и планирует будущие покупки.
  Предпочитай простые, понятные решения и минимальную архитектуру.
  Не добавляй сложные абстракции, инфраструктуру и зависимости без
  конкретной необходимости для текущей задачи. Используй возможности
  выбранного стека, прежде чем подключать дополнительные библиотеки.
  Не закладывай многопользовательский режим и масштабирование впрок.
  SQL, схема SQLite, соединения и настройка хранилища сосредоточены в
  ovdp_tracker/db.py. Класс Database хранит приватное соединение и не зависит
  от Flask, g или current_app. Остальные модули получают экземпляр явно,
  получают обычные словари/списки и не используют sqlite3 напрямую.
  Одиночные записи сохраняются автоматически; связанные изменения объединяются
  через with database.transaction(), без выдачи соединения вызывающему коду.
  В HTTP используй with_database из ovdp_tracker/web.py для создания отдельного
  экземпляра на запрос, передачи обработчику и гарантированного закрытия.
  Вне HTTP используй with Database(path) as database.
  Финансовые расчёты и проверка истории используют методы Database и остаются в предметных модулях.
  Обычные тесты проверяют API; прямой SQLite допустим только в отдельных
  низкоуровневых тестах схемы, инициализации и управления соединениями.
  Средство автоматического тестирования проекта — pytest. Пиши тесты функциями
  с assert, фикстурами и параметризацией; для временных баз используй tmp_path.
  Зависимости тестирования фиксируй в requirements-dev.txt; запуск — python -m pytest.
  Комментарии и docstring в исходном коде и тестах пиши на английском языке.
  Тексты ошибок и сообщений исключений в коде и тестах пиши на английском языке.
  Максимальная длина строки кода — 120 символов; не переноси выражения,
  которые целиком помещаются в этот лимит с учётом отступа.
  Между соседними функциями и методами оставляй две пустые строки, в том числе в классе.
  Внутри функции разделяй логические блоки одной пустой строкой. В сложной функции
  перед каждым логическим блоком пиши однострочный комментарий на английском.
  Публичные методы классов снабжай английским docstring: сначала цель функции,
  затем значимые входные параметры и результат, включая значимое выдаваемое значение контекстного менеджера.
  Если значимых параметров нет, не описывай отсутствие аргументов и не пиши Accept no arguments.
  Если функция ничего не возвращает, не пиши return None и не добавляй секцию Returns только ради None.
  Значимое None, например при отсутствии искомой записи, описывай как часть результата.
  Пиши артефакты OpenSpec на русском языке.

rules:
  proposal:
    - Кратко описывай пользу для единственного пользователя и границы изменения.
    - Не расширяй задачу функциями, которые не нужны для заявленного сценария.
  design:
    - Выбирай самое простое решение, достаточное для текущих требований.
    - Обосновывай новые зависимости и дополнительные архитектурные слои.
  specs:
    - Формулируй проверяемое поведение через конкретные пользовательские сценарии.
    - Для расчётов явно указывай исходные данные, период, единицы и правила округления.
    - Различай фактически полученную и ожидаемую прибыль, а также запланированные и совершённые покупки.
  tasks:
    - Разбивай работу на небольшие конкретные задачи без лишних подготовительных этапов.
    - Включай проверки, соразмерные изменению; для финансовых расчётов используй примеры с известным результатом.
