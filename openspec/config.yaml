schema: spec-driven

context: |
  Небольшой пет-проект для единоличного использования: трекер ОВДП
  (облигаций внутреннего государственного займа Украины).
  Пользователь добавляет облигации, отслеживает даты покупки и погашения,
  полученную и ожидаемую прибыль, смотрит статистику доходности
  за различные периоды и планирует будущие покупки.
  Предпочитай простые, понятные решения и минимальную архитектуру.
  Не добавляй сложные абстракции, инфраструктуру и зависимости без
  конкретной необходимости для текущей задачи. Используй возможности
  выбранного стека, прежде чем подключать дополнительные библиотеки.
  Не закладывай многопользовательский режим и масштабирование впрок.
  Пиши артефакты OpenSpec на русском языке.

rules:
  proposal:
    - Кратко описывай пользу для единственного пользователя и границы изменения.
    - Не расширяй задачу функциями, которые не нужны для заявленного сценария.
  design:
    - Выбирай самое простое решение, достаточное для текущих требований.
    - Обосновывай новые зависимости и дополнительные архитектурные слои.
  specs:
    - Формулируй проверяемое поведение через конкретные пользовательские сценарии.
    - Для расчётов явно указывай исходные данные, период, единицы и правила округления.
    - Различай фактически полученную и ожидаемую прибыль, а также запланированные и совершённые покупки.
  tasks:
    - Разбивай работу на небольшие конкретные задачи без лишних подготовительных этапов.
    - Включай проверки, соразмерные изменению; для финансовых расчётов используй примеры с известным результатом.
